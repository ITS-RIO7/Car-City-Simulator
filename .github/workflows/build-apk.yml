name: Build APK

on:
  push:
    branches: [ flutter-port ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # Pinned: the newest Flutter stable template resolves its Kotlin build
      # dependencies from the plugin portal only, where kotlin-stdlib 2.2.21 is
      # missing, and Gradle dies before compiling any Dart. 3.47.7 works.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # A fresh CI runner would otherwise generate a new debug keystore each
      # run, so every APK would be signed differently and could never update an
      # existing install.
      - name: Restore Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # The repo keeps the Dart sources and pubspec only; android/ is generated
      # here into a throwaway project and copied in, so lib/ can never be
      # overwritten.
      - name: Generate android folder if missing
        run: |
          if [ ! -d "android" ]; then
            TMP="$(mktemp -d)"
            flutter create "$TMP/seed" --platforms=android --project-name drift_horizon
            cp -r "$TMP/seed/android" ./android
            rm -rf "$TMP"
          fi

      - name: Configure Android project
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          app_id = "com.example.drifthorizon"

          for name in ("android/app/build.gradle", "android/app/build.gradle.kts"):
              path = pathlib.Path(name)
              if not path.exists():
                  continue
              text = path.read_text()
              text = re.sub(r'(applicationId[ \t]*=?[ \t]*)"[^"]*"',
                            lambda m: m.group(1) + '"' + app_id + '"', text)
              text = re.sub(r'(namespace[ \t]*=?[ \t]*)"[^"]*"',
                            lambda m: m.group(1) + '"' + app_id + '"', text)
              path.write_text(text)
              print("configured", name, "->", app_id)

          ver = "1.0.0"
          pv = pathlib.Path("pubspec.yaml")
          if pv.exists():
              mv = re.search(r'^version:\s*([0-9]+\.[0-9]+\.[0-9]+)', pv.read_text(), re.M)
              if mv:
                  ver = mv.group(1)
          label = "Drift Horizon " + ver

          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              m = manifest.read_text()
              m = re.sub(r'android:label="[^"]*"', 'android:label="' + label + '"', m)
              manifest.write_text(m)
              print("labelled the app as", label)
          PY

      - name: Show Android SDK configuration
        run: |
          grep -rnE "compileSdk|targetSdk|minSdk|ndkVersion" android/app/build.gradle* || true

      - name: Gradle fixes (R8 rules)
        run: |
          cat > android/app/proguard-rules.pro <<'EOF'
          -dontwarn com.google.android.play.core.**
          -dontwarn io.flutter.**
          -keep class io.flutter.** { *; }
          -keep class com.google.android.play.core.** { *; }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyse
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # --no-shrink skips R8 minification, the biggest cause of release failures.
      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'apk-latest' }}
          name: Drift Horizon APK
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: build/app/outputs/flutter-apk/app-release.apk
